name: 缺陷报告
description: 报告一个可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并移除日志、截图中的个人信息与本机路径。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么，你期望发生什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出可以稳定复现的最短步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Island HUD 版本
      description: 设置页或关于信息中的版本号
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 功能区域
      options:
        - 悬浮岛界面
        - 审批
        - 问答
        - 会话管理
        - 设置
        - 托盘与快捷键
        - 插件安装与卸载
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可粘贴托盘菜单「复制诊断信息」的结果，请先脱敏
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
        - label: 我已移除日志和截图中的个人信息、令牌与本机路径
          required: true
