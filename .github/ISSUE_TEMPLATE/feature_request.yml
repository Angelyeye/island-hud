name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索已有 Issue，并说明你的使用场景，而不仅是功能名称。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 在什么场景下感到不便，现有行为是什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你希望它如何工作；如果考虑过替代方案也可以写在这里
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 功能区域
      options:
        - 悬浮岛界面
        - 审批
        - 问答
        - 会话管理
        - 设置
        - 托盘与快捷键
        - 插件安装与卸载
        - 打包与发布
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充信息
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
