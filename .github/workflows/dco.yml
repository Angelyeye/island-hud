name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify every commit has a Signed-off-by line
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          status=0
          for commit in $(git rev-list "$base"..HEAD); do
            if ! git log -1 --format=%B "$commit" | grep -Eqi '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $commit is missing a Signed-off-by line."
              status=1
            fi
          done
          exit $status
