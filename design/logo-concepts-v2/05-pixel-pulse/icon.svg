<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Island HUD — Pixel Pulse</title>
  <desc id="desc">A blue pixel-built floating capsule combining a terminal prompt, an activity waveform, and an amber response beacon.</desc>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="#17191D"/>
  <rect x="34" y="34" width="956" height="956" rx="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <g shape-rendering="crispEdges">
    <rect x="672" y="192" width="64" height="64" fill="#FF8A42"/>
    <g fill="#5B8CFF">
      <rect x="288" y="320" width="448" height="64"/>
      <rect x="224" y="384" width="576" height="64"/>
      <rect x="160" y="448" width="704" height="64"/>
      <rect x="128" y="512" width="768" height="128"/>
      <rect x="160" y="640" width="704" height="64"/>
      <rect x="224" y="704" width="576" height="64"/>
      <rect x="288" y="768" width="448" height="64"/>
    </g>
    <g fill="#17191D">
      <rect x="256" y="384" width="64" height="64"/>
      <rect x="256" y="448" width="128" height="64"/>
      <rect x="320" y="512" width="128" height="64"/>
      <rect x="256" y="576" width="128" height="64"/>
      <rect x="256" y="640" width="64" height="64"/>
      <rect x="512" y="512" width="64" height="128"/>
      <rect x="640" y="448" width="64" height="256"/>
      <rect x="768" y="512" width="64" height="128"/>
    </g>
  </g>
</svg>
