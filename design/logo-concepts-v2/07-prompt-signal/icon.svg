<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Island HUD — Prompt Signal</title>
  <desc id="desc">A blue pixel command prompt paired with a floating signal island, three waveform cuts, and an amber response pixel.</desc>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="#17191D"/>
  <rect x="34" y="34" width="956" height="956" rx="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <g shape-rendering="crispEdges">
    <g fill="#5B8CFF">
      <rect x="128" y="384" width="64" height="64"/>
      <rect x="128" y="448" width="128" height="64"/>
      <rect x="192" y="512" width="128" height="64"/>
      <rect x="128" y="576" width="128" height="64"/>
      <rect x="128" y="640" width="64" height="64"/>
      <rect x="576" y="384" width="256" height="64"/>
      <rect x="512" y="448" width="320" height="64"/>
      <rect x="448" y="512" width="448" height="128"/>
      <rect x="512" y="640" width="320" height="64"/>
    </g>
    <g fill="#17191D">
      <rect x="512" y="512" width="64" height="128"/>
      <rect x="640" y="448" width="64" height="256"/>
      <rect x="768" y="512" width="64" height="128"/>
    </g>
    <rect x="704" y="256" width="64" height="64" fill="#FF8A42"/>
  </g>
</svg>
