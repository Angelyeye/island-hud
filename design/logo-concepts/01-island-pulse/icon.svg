<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Island HUD — Island Pulse</title>
  <desc id="desc">A white floating island with a blue activity wave and an amber response light on a blue rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="144" y1="96" x2="872" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6675FF"/>
      <stop offset="0.52" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#294BC5"/>
    </linearGradient>
    <linearGradient id="wave" x1="336" y1="400" x2="600" y2="624" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#2699ED"/>
    </linearGradient>
    <filter id="shadow" x="100" y="316" width="824" height="416" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#10266F" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="34" y="34" width="956" height="956" rx="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
  <g filter="url(#shadow)">
    <rect x="142" y="342" width="740" height="340" rx="170" fill="#F7F9FF"/>
    <rect x="316" y="440" width="64" height="144" rx="32" fill="url(#wave)"/>
    <rect x="432" y="400" width="64" height="224" rx="32" fill="url(#wave)"/>
    <rect x="548" y="440" width="64" height="144" rx="32" fill="url(#wave)"/>
    <circle cx="716" cy="512" r="56" fill="#FF8A42"/>
  </g>
</svg>
